<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16323a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رحلات القصاص - حجز">
<title>رحلات القصاص - حجز مقعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--ink:#16323a;--mute:#5d7178;--free:#ffffff;--freeb:#9db3b8;--sel:#e8a317;--taken:#16323a;--line:#d3dcda;--danger:#b3372b;--ok:#2b7a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button,input{font:inherit}
.top{position:sticky;top:0;background:var(--ink);color:#fff;padding:14px 14px 10px;z-index:5;text-align:center}
.top h1{font-size:19px;margin:0 0 2px;font-weight:800}
.top p{margin:0;font-size:12px;color:#c9d6d9}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 8px}
.day{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;text-align:center;min-width:52px;color:var(--ink)}
.day b{display:block;font-size:13px}
.day small{font-size:10px;color:var(--mute)}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day.on small{color:#c9d6d9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;min-width:84px}
.tab b{display:block;font-size:16px}
.tab small{color:var(--mute)}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tab.on small{color:#c9d6d9}
.vanwrap{max-width:380px;margin:6px auto 0;padding:0 8px;perspective:1100px}
.vanwrap svg{width:100%;height:auto;display:block;transform:rotateX(9deg);transform-origin:50% 100%;filter:drop-shadow(0 12px 8px rgba(0,0,0,.25));overflow:visible}
.seat{cursor:pointer}
.seat:active{opacity:.8}
.seat .sh,.dseat .sh{fill:rgba(0,0,0,.2)}
.seat .bk,.seat .hd{fill:url(#gfb);stroke:var(--freeb);stroke-width:1.6}
.seat .cu{fill:url(#gfc);stroke:var(--freeb);stroke-width:1.6}
.seat .st,.dseat .st{fill:none;stroke:#c3d0d2;stroke-width:1.4;stroke-dasharray:3 3}
.seat.sel .bk,.seat.sel .hd{fill:url(#gsb);stroke:#b97f00}
.seat.sel .cu{fill:url(#gsc);stroke:#b97f00}
.seat.sel .st{stroke:#fff3c4}
.seat.taken{cursor:default}
.seat.taken .bk,.seat.taken .hd{fill:url(#gtb);stroke:#0b1c21}
.seat.taken .cu{fill:url(#gtc);stroke:#0b1c21}
.seat.taken .st{stroke:#5b8896}
.dseat .bk,.dseat .hd,.dseat .cu{fill:#8fa2a8;stroke:#5f747b;stroke-width:1.6}
.seat text,.dseat text{font-family:Cairo,Tahoma,sans-serif;font-weight:800;fill:var(--ink);pointer-events:none}
.seat.taken text,.dseat text{fill:#fff}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:2px solid var(--freeb)}
.legend i.f{background:#fff}.legend i.s{background:var(--sel);border-color:#b97f00}.legend i.t{background:var(--ink);border-color:#0b1c21}
.info{text-align:center;color:var(--mute);font-size:14px;margin:10px 14px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));margin-top:16px;display:flex;gap:10px;align-items:center}
.bar input{flex:1;min-width:0;padding:12px;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:right;font-size:18px}
.btn{border:0;background:var(--ok);color:#fff;font-weight:800;border-radius:10px;padding:12px 18px}
.btn:disabled{background:#b8c4c6}
.btn.wa{background:#1f9d55}
.dlg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.dlg>div{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:20px;text-align:center}
.dlg p{font-size:18px;margin:0 0 6px}
.dlg .ph{font-size:22px;font-weight:800;direction:ltr;margin-bottom:14px}
.dlg .stack{display:grid;gap:10px}
.dlg a.btn{display:block;text-decoration:none}
.dlg .row{display:flex;gap:10px}.dlg .row button{flex:1}
.dlg .row .btn:first-child{background:#e3e9e7;color:var(--ink)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gfb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e1e9e8"/></linearGradient>
<linearGradient id="gfc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f4"/><stop offset="1" stop-color="#cbd7d6"/></linearGradient>
<linearGradient id="gsb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#eba91b"/></linearGradient>
<linearGradient id="gsc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c443"/><stop offset="1" stop-color="#d6900a"/></linearGradient>
<linearGradient id="gtb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33606f"/><stop offset="1" stop-color="#173540"/></linearGradient>
<linearGradient id="gtc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#274f5d"/><stop offset="1" stop-color="#102830"/></linearGradient>
</defs></svg>

<div class="top">
  <h1>رحلات القصاص</h1>
  <p>احجز كرسيك بنفسك</p>
</div>
<div class="days" id="days"></div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div class="bar" id="bar" hidden>
  <input id="phone" type="tel" inputmode="tel" placeholder="رقم تليفونك">
  <button class="btn" id="book" disabled>احجز</button>
</div>

<div class="dlg" id="dlg" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7S2CS_B-euNiW1vyBBVgI1uHFAz4H5yU",
  authDomain: "alqasas-travel.firebaseapp.com",
  databaseURL: "https://alqasas-travel-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "alqasas-travel",
  storageBucket: "alqasas-travel.firebasestorage.app",
  messagingSenderId: "866747292985",
  appId: "1:866747292985:web:99eb9618fc4bc9c4a09ce8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
let date = '', van = null, vans = {}, avail = {}, sel = new Set(), refA = null;

const SEAT = '<svg viewBox="0 0 64 72"><ellipse class="sh" cx="32" cy="67" rx="25" ry="4"/><rect class="ar" x="3" y="30" width="12" height="34" rx="6"/><rect class="ar" x="49" y="30" width="12" height="34" rx="6"/><rect class="hd" x="19" y="2" width="26" height="15" rx="7.5"/><rect class="bk" x="9" y="11" width="46" height="44" rx="15"/><rect class="st" x="17" y="19" width="30" height="28" rx="10"/><rect class="cu" x="6" y="46" width="52" height="19" rx="9"/><path class="hl" d="M14 51h36"/></svg>';
const SEATSHAPE = '<rect class="sh" x="3" y="6" width="66" height="76" rx="14"/><rect class="cu" x="2" y="2" width="64" height="50" rx="13"/><rect class="st" x="10" y="8" width="48" height="38" rx="9"/><rect class="bk" x="0" y="46" width="68" height="26" rx="11"/><rect class="hd" x="20" y="66" width="28" height="12" rx="6"/>';
const WHEEL = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="5" fill="currentColor"/><path d="M10 32h17M37 32h17M32 37v19"/></svg>';
let VAN_TOP = '';
(function(){
  const rowsY=[255,350,445,540]; let wins='';
  [150,...rowsY].forEach(y=>{
    wins+=`<rect x="33" y="${y+6}" width="6" height="64" rx="3" fill="url(#vg)" stroke="#16323a" stroke-width="1"/>`;
    wins+=`<rect x="281" y="${y+6}" width="6" height="64" rx="3" fill="url(#vg)" stroke="#16323a" stroke-width="1"/>`;
  });
  VAN_TOP = '<svg viewBox="0 0 320 690" xmlns="http://www.w3.org/2000/svg">'+
  '<defs><linearGradient id="vb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f7f6"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3d1"/></linearGradient>'+
  '<linearGradient id="vf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd7d5"/><stop offset="1" stop-color="#b9c4c1"/></linearGradient>'+
  '<linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f1f4"/><stop offset="1" stop-color="#9dbfcb"/></linearGradient></defs>'+
  '<ellipse cx="160" cy="672" rx="128" ry="12" fill="rgba(0,0,0,.22)"/>'+
  '<rect x="14" y="118" width="22" height="64" rx="8" fill="#20282b"/><rect x="284" y="118" width="22" height="64" rx="8" fill="#20282b"/>'+
  '<rect x="14" y="500" width="22" height="64" rx="8" fill="#20282b"/><rect x="284" y="500" width="22" height="64" rx="8" fill="#20282b"/>'+
  '<rect x="4" y="96" width="26" height="13" rx="6" fill="#20282b"/><rect x="290" y="96" width="26" height="13" rx="6" fill="#20282b"/>'+
  '<path d="M30 92 Q30 24 104 20 L216 20 Q290 24 290 92 L290 636 Q290 664 262 664 L58 664 Q30 664 30 636 Z" fill="url(#vb)" stroke="#16323a" stroke-width="3"/>'+
  '<ellipse cx="160" cy="48" rx="86" ry="14" fill="#fff" opacity=".65"/>'+
  '<rect x="58" y="26" width="34" height="10" rx="5" fill="#ffd25a" stroke="#16323a" stroke-width="1.5"/><rect x="228" y="26" width="34" height="10" rx="5" fill="#ffd25a" stroke="#16323a" stroke-width="1.5"/>'+
  '<path d="M58 90 Q160 52 262 90 L252 112 Q160 82 68 112 Z" fill="url(#vg)" stroke="#16323a" stroke-width="2.5"/>'+
  '<rect x="42" y="112" width="236" height="540" rx="12" fill="url(#vf)" stroke="#16323a" stroke-width="2"/>'+
  '<rect x="42" y="112" width="236" height="26" rx="10" fill="#33424a"/>'+
  '<circle cx="83" cy="126" r="12" fill="none" stroke="#e3eaec" stroke-width="3.5"/><circle cx="83" cy="126" r="3" fill="#e3eaec"/><path d="M71 126h9M86 126h9M83 130v8" stroke="#e3eaec" stroke-width="3"/>'+
  wins+
  '<rect x="278" y="250" width="12" height="192" fill="none" stroke="#16323a" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="292" y="330" width="4" height="26" rx="2" fill="#16323a"/>'+
  '<rect x="36" y="638" width="16" height="10" rx="4" fill="#d24a3c"/><rect x="268" y="638" width="16" height="10" rx="4" fill="#d24a3c"/>'+
  '<g transform="translate(49,150)">'+SEATSHAPE+'<text x="34" y="33" text-anchor="middle" font-size="11" font-family="Cairo,Tahoma,sans-serif" fill="var(--mute)">السواق</text></g>';
})();
const SEATPOS = [[1,127,150],[2,205,150],[3,49,255],[4,127,255],[5,205,255],[6,49,350],[7,127,350],[8,205,350],[9,49,445],[10,127,445],[11,205,445],[12,49,540],[13,127,540],[14,205,540]];
const TOTAL = 14;
const vo = id => { const v = vans[id]; return (v && typeof v === 'object') ? v : { name: v || '' }; };
const intl = p => { let d = String(p).replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '20' + d.slice(1); return d; };
const wa = (n, m) => `https://wa.me/${intl(n)}?text=${encodeURIComponent(m)}`;

const DOW = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function renderDays() {
  let h = '';
  for (let i = 0; i < 10; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const val = ymd(d);
    const label = i === 0 ? 'النهارده' : i === 1 ? 'بكرة' : DOW[d.getDay()];
    h += `<button class="day ${val===date?'on':''}" data-d="${val}"><b>${label}</b><small>${d.getDate()}/${d.getMonth()+1}</small></button>`;
  }
  $('days').innerHTML = h;
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { date = b.dataset.d; sel.clear(); renderDays(); listen(); });
}
date = ymd(new Date());
renderDays();

db.ref('vans').on('value', s => {
  vans = s.val() || {};
  if (!van || !vans[van]) van = Object.keys(vans)[0] || null;
  sel.clear(); render();
});
function listen() {
  if (refA) refA.off();
  refA = db.ref('avail/' + date);
  refA.on('value', s => { avail = s.val() || {}; sel.forEach(n => { if ((avail[van]||{})[n]) sel.delete(n); }); render(); });
}
listen();

function render() {
  const ids = Object.keys(vans);
  $('tabs').innerHTML = ids.map(id => {
    const a = avail[id] || {}, free = TOTAL - Object.keys(a).length;
    return `<button class="tab ${id===van?'on':''}" data-v="${id}"><b>${esc(vo(id).name)}</b><small>${vo(id).time?esc(vo(id).time)+' · ':''}فاضي ${free}</small></button>`;
  }).join('');
  document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = () => { van = b.dataset.v; sel.clear(); render(); });

  if (!van) { $('main').innerHTML = `<div class="empty">مفيش عربيات متاحة دلوقتي.</div>`; $('bar').hidden = true; return; }
  const a = avail[van] || {}, v = vo(van);
  let h = `<div class="vanwrap">` + VAN_TOP;
  SEATPOS.forEach(([n, x, y]) => {
    const tk = a[n];
    h += `<g class="seat ${tk?'taken':''} ${sel.has(n)?'sel':''}" data-s="${n}" transform="translate(${x},${y})">${SEATSHAPE}<text x="34" y="34" text-anchor="middle" font-size="21">${n}</text></g>`;
  });
  h += `</svg></div>
  <div class="legend"><span><i class="f"></i>فاضي</span><span><i class="s"></i>مختار</span><span><i class="t"></i>محجوز</span></div>
  <p class="info">${v.driver ? 'السواق: ' + esc(v.driver) : ''}${sel.size ? '<br>مختار: ' + [...sel].sort((x,y)=>x-y).join('، ') : (v.driver?'':'دوس على كرسي فاضي عشان تختاره')}</p>`;
  $('main').innerHTML = h;
  document.querySelectorAll('.seat').forEach(el => el.onclick = () => tapSeat(+el.dataset.s));
  $('bar').hidden = false;
  checkBtn();
}
function checkBtn() { $('book').disabled = !(sel.size && $('phone').value.replace(/\D/g,'').length >= 8); }
$('phone').oninput = checkBtn;

function tapSeat(n) {
  if ((avail[van] || {})[n]) return;
  sel.has(n) ? sel.delete(n) : sel.add(n);
  render();
}

$('book').onclick = async () => {
  const phone = $('phone').value.replace(/\s/g, '');
  const seats = [...sel], ok = [], failed = [];
  $('book').disabled = true;
  for (const n of seats) {
    try {
      const r = await db.ref(`avail/${date}/${van}/${n}`).transaction(cur => cur ? undefined : true);
      if (r.committed) { await db.ref(`bookings/${date}/${van}/${n}`).set({ phone, at: firebase.database.ServerValue.TIMESTAMP }); ok.push(n); }
      else failed.push(n);
    } catch (e) { failed.push(n); }
  }
  sel.clear(); render();
  if (ok.length) showDone(phone, ok);
  else if (failed.length) alert('الكراسي دي اتحجزت قبلك: ' + failed.join('، '));
};

function showDone(phone, seats) {
  const v = vo(van), list = seats.sort((a,b)=>a-b).join('، '), w = seats.length > 1 ? 'الكراسي' : 'الكرسي';
  const d = $('dlg');
  let body = `<p>تم الحجز ✅</p><p class="ph">${w} رقم ${list}</p><p style="color:var(--mute);font-size:14px;margin-top:-8px">${esc(v.name)}${v.time?' · '+esc(v.time):''} · ${date}</p>`;
  if (v.ownerPhone) {
    const msg = `حجز جديد - ${v.name} - ${date}${v.time?' '+v.time:''} - ${w} ${list} - تليفون الراكب ${phone}`;
    body += `<div class="stack"><a class="btn wa" target="_blank" rel="noopener" href="${wa(v.ownerPhone, msg)}">تأكيد الحجز مع صاحب العربية (واتساب)</a><button class="btn" id="dn" style="background:#e3e9e7;color:var(--ink)">تم</button></div>`;
  } else {
    body += `<button class="btn" id="dn" style="width:100%">تم</button>`;
  }
  d.innerHTML = `<div>${body}</div>`;
  d.hidden = false;
  $('dn').onclick = () => { d.hidden = true; $('phone').value = ''; };
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
