<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16323a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رحلات القصاص">
<title>رحلات القصاص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--ink:#16323a;--mute:#5d7178;--free:#2fa35c;--freeb:#1f7d44;--sel:#e8a317;--taken:#c0392b;--takenb:#8e2a1e;--line:#d3dcda;--danger:#b3372b;--ok:#2b7a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button,input,select{font:inherit}
.top{position:sticky;top:0;background:var(--ink);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
.top h1{font-size:18px;margin:0;flex:1;font-weight:800}
.top input[type=date]{border:0;border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
.top button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 8px}
.day{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;text-align:center;min-width:52px;color:var(--ink)}
.day b{display:block;font-size:13px}
.day small{font-size:10px;color:var(--mute)}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day.on small{color:#c9d6d9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;min-width:84px}
.tab b{display:block;font-size:16px}
.tab small{color:var(--mute)}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tab.on small{color:#c9d6d9}
.tab.add{border-style:dashed;color:var(--mute);background:none}
.grid{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vanwrap{max-width:380px;margin:6px auto 0;padding:0 8px;perspective:1100px}
.vanwrap svg{width:100%;height:auto;display:block;transform:rotateX(9deg);transform-origin:50% 100%;filter:drop-shadow(0 12px 8px rgba(0,0,0,.25));overflow:visible}
.seat{cursor:pointer}
.seat:active{opacity:.8}
.seat .sh,.dseat .sh{fill:rgba(0,0,0,.2)}
.seat .bk,.seat .hd{fill:url(#gfb);stroke:var(--freeb);stroke-width:1.6}
.seat .cu{fill:url(#gfc);stroke:var(--freeb);stroke-width:1.6}
.seat .st,.dseat .st{fill:none;stroke:#bfe4cd;stroke-width:1.4;stroke-dasharray:3 3}
.seat.sel .bk,.seat.sel .hd{fill:url(#gsb);stroke:#b97f00}
.seat.sel .cu{fill:url(#gsc);stroke:#b97f00}
.seat.sel .st{stroke:#fff3c4}
.seat.taken .bk,.seat.taken .hd{fill:url(#gtb);stroke:var(--takenb)}
.seat.taken .cu{fill:url(#gtc);stroke:var(--takenb)}
.seat.taken .st{stroke:#f0b3ac}
.dseat .bk,.dseat .hd,.dseat .cu{fill:#8fa2a8;stroke:#5f747b;stroke-width:1.6}
.seat text,.dseat text{font-family:Cairo,Tahoma,sans-serif;font-weight:800;fill:#fff;pointer-events:none}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:2px solid}
.legend i.f{background:var(--free);border-color:var(--freeb)}
.legend i.s{background:var(--sel);border-color:#b97f00}
.legend i.t{background:var(--taken);border-color:var(--takenb)}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input{flex:1;min-width:0;padding:12px;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:right;font-size:18px}
.btn{border:0;background:var(--ok);color:#fff;font-weight:800;border-radius:10px;padding:12px 18px}
.btn:disabled{background:#b8c4c6}
.btn.red{background:var(--danger)}
.btn.wa{background:#1f9d55}
.info{text-align:center;color:var(--mute);font-size:14px;margin:10px 14px 0}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
#login{max-width:340px;margin:12vh auto;padding:0 20px}
#login h1{font-size:26px;margin:0 0 4px}
#login input{width:100%;padding:12px;margin:8px 0;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:left}
#login .btn{width:100%;margin-top:6px}
.err{color:var(--danger);font-size:14px;min-height:20px}
.dlg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.dlg>div{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:20px;text-align:center;max-height:88vh;overflow:auto}
.dlg p{font-size:18px;margin:0 0 6px}
.dlg .ph{font-size:22px;font-weight:800;direction:ltr;margin-bottom:10px}
.dlg .row{display:flex;gap:10px}.dlg .row button{flex:1}
.dlg .row .btn:first-child{background:#e3e9e7;color:var(--ink)}
.dlg input{width:100%;padding:12px;margin:6px 0;border:2px solid var(--line);border-radius:10px}
.stack{display:grid;gap:10px}
a.btn{display:block;text-decoration:none}
.vinfo{text-align:center;font-size:15px;margin:12px 14px 0}
.vinfo button{border:0;background:none;color:var(--ink);text-decoration:underline;font-size:14px}
.triplist{text-align:right;margin:10px 0}
.triprow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.triprow b{flex:1;font-size:14px}
.triprow button{border:0;background:none;color:var(--danger);font-weight:800}
.addtrip{display:flex;gap:6px}
.addtrip input{flex:1}
.warn{background:#fff3cd;color:#7a5b00;border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 14px 0;text-align:center}
.summary{max-width:380px;margin:16px auto 0;padding:0 14px}
.summary h3{font-size:15px;margin:0 0 8px}
.srow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.srow span.muted{color:var(--mute)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gfb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc07e"/><stop offset="1" stop-color="#1f7d44"/></linearGradient>
<linearGradient id="gfc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb06e"/><stop offset="1" stop-color="#1c6b3b"/></linearGradient>
<linearGradient id="gsb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#eba91b"/></linearGradient>
<linearGradient id="gsc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c443"/><stop offset="1" stop-color="#d6900a"/></linearGradient>
<linearGradient id="gtb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e05545"/><stop offset="1" stop-color="#a5291c"/></linearGradient>
<linearGradient id="gtc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d14636"/><stop offset="1" stop-color="#8e2a1e"/></linearGradient>
</defs></svg>

<div id="login" hidden>
  <h1>رحلات القصاص</h1>
  <p style="color:var(--mute);margin:0 0 14px">سجّل دخولك بحساب الموظفين</p>
  <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="btn" id="lbtn">دخول</button>
</div>

<div id="app" hidden>
  <div class="top">
    <h1>رحلات القصاص</h1>
    <input type="date" id="date">
    <button id="out">خروج</button>
  </div>
  <div class="days" id="days"></div>
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="trips"></div>
  <div id="main"></div>
  <div class="bar" id="bar" hidden>
    <input id="phone" type="tel" inputmode="tel" placeholder="رقم تليفون الراكب">
    <button class="btn" id="book" disabled>احجز</button>
  </div>
  <div class="summary" id="summary"></div>
</div>

<div class="dlg" id="dlg" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7S2CS_B-euNiW1vyBBVgI1uHFAz4H5yU",
  authDomain: "alqasas-travel.firebaseapp.com",
  databaseURL: "https://alqasas-travel-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "alqasas-travel",
  storageBucket: "alqasas-travel.firebasestorage.app",
  messagingSenderId: "866747292985",
  appId: "1:866747292985:web:99eb9618fc4bc9c4a09ce8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.database();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const t0 = new Date();
let date = `${t0.getFullYear()}-${pad(t0.getMonth()+1)}-${pad(t0.getDate())}`;
let van = null, trip = null, vans = {}, dayBookings = {}, sel = new Set(), refB = null, started = false, isDriver = false;

const TOTAL = 14;
const SEATSHAPE = "<rect class=\"sh\" x=\"3\" y=\"6\" width=\"66\" height=\"76\" rx=\"14\"/><rect class=\"cu\" x=\"2\" y=\"2\" width=\"64\" height=\"50\" rx=\"13\"/><rect class=\"st\" x=\"10\" y=\"8\" width=\"48\" height=\"38\" rx=\"9\"/><rect class=\"bk\" x=\"0\" y=\"46\" width=\"68\" height=\"26\" rx=\"11\"/><rect class=\"hd\" x=\"20\" y=\"66\" width=\"28\" height=\"12\" rx=\"6\"/>";
const VAN_TOP = "<svg viewBox=\"0 0 320 690\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"vb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#f4f7f6\"/><stop offset=\".5\" stop-color=\"#ffffff\"/><stop offset=\"1\" stop-color=\"#c9d3d1\"/></linearGradient><linearGradient id=\"vf\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#cfd7d5\"/><stop offset=\"1\" stop-color=\"#b9c4c1\"/></linearGradient><linearGradient id=\"vg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#e6f1f4\"/><stop offset=\"1\" stop-color=\"#9dbfcb\"/></linearGradient></defs><ellipse cx=\"160\" cy=\"672\" rx=\"128\" ry=\"12\" fill=\"rgba(0,0,0,.22)\"/><rect x=\"14\" y=\"118\" width=\"22\" height=\"64\" rx=\"8\" fill=\"#20282b\"/><rect x=\"284\" y=\"118\" width=\"22\" height=\"64\" rx=\"8\" fill=\"#20282b\"/><rect x=\"14\" y=\"500\" width=\"22\" height=\"64\" rx=\"8\" fill=\"#20282b\"/><rect x=\"284\" y=\"500\" width=\"22\" height=\"64\" rx=\"8\" fill=\"#20282b\"/><rect x=\"4\" y=\"96\" width=\"26\" height=\"13\" rx=\"6\" fill=\"#20282b\"/><rect x=\"290\" y=\"96\" width=\"26\" height=\"13\" rx=\"6\" fill=\"#20282b\"/><path d=\"M30 92 Q30 24 104 20 L216 20 Q290 24 290 92 L290 636 Q290 664 262 664 L58 664 Q30 664 30 636 Z\" fill=\"url(#vb)\" stroke=\"#16323a\" stroke-width=\"3\"/><ellipse cx=\"160\" cy=\"48\" rx=\"86\" ry=\"14\" fill=\"#fff\" opacity=\".65\"/><rect x=\"58\" y=\"26\" width=\"34\" height=\"10\" rx=\"5\" fill=\"#ffd25a\" stroke=\"#16323a\" stroke-width=\"1.5\"/><rect x=\"228\" y=\"26\" width=\"34\" height=\"10\" rx=\"5\" fill=\"#ffd25a\" stroke=\"#16323a\" stroke-width=\"1.5\"/><path d=\"M58 90 Q160 52 262 90 L252 112 Q160 82 68 112 Z\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"2.5\"/><rect x=\"42\" y=\"112\" width=\"236\" height=\"540\" rx=\"12\" fill=\"url(#vf)\" stroke=\"#16323a\" stroke-width=\"2\"/><rect x=\"42\" y=\"112\" width=\"236\" height=\"26\" rx=\"10\" fill=\"#33424a\"/><circle cx=\"83\" cy=\"126\" r=\"12\" fill=\"none\" stroke=\"#e3eaec\" stroke-width=\"3.5\"/><circle cx=\"83\" cy=\"126\" r=\"3\" fill=\"#e3eaec\"/><path d=\"M71 126h9M86 126h9M83 130v8\" stroke=\"#e3eaec\" stroke-width=\"3\"/><rect x=\"33\" y=\"156\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"281\" y=\"156\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"33\" y=\"261\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"281\" y=\"261\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"33\" y=\"356\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"281\" y=\"356\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"33\" y=\"451\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"281\" y=\"451\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"33\" y=\"546\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"281\" y=\"546\" width=\"6\" height=\"64\" rx=\"3\" fill=\"url(#vg)\" stroke=\"#16323a\" stroke-width=\"1\"/><rect x=\"278\" y=\"250\" width=\"12\" height=\"192\" fill=\"none\" stroke=\"#16323a\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><rect x=\"292\" y=\"330\" width=\"4\" height=\"26\" rx=\"2\" fill=\"#16323a\"/><rect x=\"36\" y=\"638\" width=\"16\" height=\"10\" rx=\"4\" fill=\"#d24a3c\"/><rect x=\"268\" y=\"638\" width=\"16\" height=\"10\" rx=\"4\" fill=\"#d24a3c\"/><g class=\"dseat\" transform=\"translate(49,150)\"><rect class=\"sh\" x=\"3\" y=\"6\" width=\"66\" height=\"76\" rx=\"14\"/><rect class=\"cu\" x=\"2\" y=\"2\" width=\"64\" height=\"50\" rx=\"13\"/><rect class=\"st\" x=\"10\" y=\"8\" width=\"48\" height=\"38\" rx=\"9\"/><rect class=\"bk\" x=\"0\" y=\"46\" width=\"68\" height=\"26\" rx=\"11\"/><rect class=\"hd\" x=\"20\" y=\"66\" width=\"28\" height=\"12\" rx=\"6\"/><text x=\"34\" y=\"33\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--mute)\">السواق</text></g>";
const SEATPOS = [[1,127,150],[2,205,150],[3,49,255],[4,127,255],[5,205,255],[6,49,350],[7,127,350],[8,205,350],[9,49,445],[10,127,445],[11,205,445],[12,49,540],[13,127,540],[14,205,540]];
const vo = id => vans[id] || {};
const trips = id => vo(id).trips || {};
const intl = p => { let d = String(p).replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '20' + d.slice(1); return d; };
const wa = (n, m) => `https://wa.me/${intl(n)}?text=${encodeURIComponent(m)}`;
const curBookings = () => ((dayBookings[van] || {})[trip] || {});

const DOW = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function renderDays() {
  let h = '';
  for (let i = 0; i < 10; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const val = ymd(d);
    const label = i === 0 ? 'النهارده' : i === 1 ? 'بكرة' : DOW[d.getDay()];
    h += `<button class="day ${val===date?'on':''}" data-d="${val}"><b>${label}</b><small>${d.getDate()}/${d.getMonth()+1}</small></button>`;
  }
  $('days').innerHTML = h;
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { date = b.dataset.d; $('date').value = date; sel.clear(); renderDays(); listen(); });
}
$('date').value = date;
renderDays();
$('date').onchange = e => { if (e.target.value) { date = e.target.value; sel.clear(); renderDays(); listen(); } };

$('lbtn').onclick = async () => {
  $('lerr').textContent = '';
  try { await auth.signInWithEmailAndPassword($('em').value.trim().toLowerCase(), $('pw').value); }
  catch (e) { $('lerr').textContent = 'خطأ في الدخول: ' + (e.code || e.message); }
};
$('out').onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  $('login').hidden = !!u; $('app').hidden = !u;
  isDriver = !!u && /^driver/i.test(u.email || '');
  if (u && !started) { started = true; start(); } else if (u) render();
});

function start() {
  db.ref('vans').on('value', s => {
    vans = s.val() || {};
    if (!van || !vans[van]) van = Object.keys(vans)[0] || null;
    if (van) { const tk = Object.keys(trips(van)); if (!trip || !trips(van)[trip]) trip = tk[0] || null; }
    sel.clear(); render();
  });
  listen();
}
function listen() {
  if (refB) refB.off();
  refB = db.ref('bookings/' + date);
  refB.on('value', s => { dayBookings = s.val() || {}; drop(); render(); });
}
function drop() { const b = curBookings(); sel.forEach(n => { if (b[n]) sel.delete(n); }); }

function render() {
  const ids = Object.keys(vans);
  $('tabs').innerHTML = ids.map(id => {
    let free = 0, cap = 0;
    Object.keys(trips(id)).forEach(tid => { cap += TOTAL; free += TOTAL - Object.keys((dayBookings[id]||{})[tid]||{}).length; });
    return `<button class="tab ${id===van?'on':''}" data-v="${id}"><b>${esc(vo(id).name)}</b><small>${cap?('فاضي '+free):'من غير رحلات'}</small></button>`;
  }).join('') + (isDriver ? '' : `<button class="tab add" id="addv"><b>+</b><small>عربية</small></button>`);
  document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = () => { van = b.dataset.v; const tk=Object.keys(trips(van)); trip = tk[0]||null; sel.clear(); render(); });
  if (!isDriver) $('addv').onclick = () => vanForm();

  if (!van) { $('main').innerHTML = `<div class="empty">مفيش عربيات لسه.<br>دوس على + وضيف أول عربية.</div>`; $('bar').hidden = true; $('trips').innerHTML=''; renderSummary(); return; }

  const tobj = trips(van), tids = Object.keys(tobj);
  $('trips').innerHTML = tids.map(tid => {
    const free = TOTAL - Object.keys((dayBookings[van]||{})[tid]||{}).length;
    return `<button class="tab ${tid===trip?'on':''}" data-t="${tid}"><b>${esc(tobj[tid].label||tobj[tid].time)}</b><small>${esc(tobj[tid].time||'')} · فاضي ${free}</small></button>`;
  }).join('') + (isDriver ? '' : `<button class="tab add" id="addt"><b>+</b><small>رحلة</small></button>`);
  document.querySelectorAll('.tab[data-t]').forEach(b => b.onclick = () => { trip = b.dataset.t; sel.clear(); render(); });
  if (!isDriver) $('addt').onclick = () => tripForm();

  if (!trip) {
    $('main').innerHTML = `<div class="empty">العربية دي مفيهاش رحلات لسه.${isDriver?'':'<br>دوس على + رحلة وضيف ميعاد.'}</div>`;
    $('bar').hidden = true; renderSummary(); return;
  }

  const b = curBookings();
  let h = `<div class="vanwrap">` + VAN_TOP;
  SEATPOS.forEach(([n, x, y]) => {
    const tk = b[n];
    h += `<g class="seat ${tk?'taken':''} ${sel.has(n)?'sel':''}" data-s="${n}" transform="translate(${x},${y})">${SEATSHAPE}<text x="34" y="34" text-anchor="middle" font-size="21">${n}</text></g>`;
  });
  h += `</svg></div>
  <div class="legend"><span><i class="f"></i>فاضي</span><span><i class="s"></i>مختار</span><span><i class="t"></i>محجوز</span></div>
  <p class="info">${sel.size ? 'مختار: ' + [...sel].sort((a,b)=>a-b).join('، ') : (isDriver ? 'دوس على الكرسي المحجوز عشان تشوف رقمه أو تلغيه' : 'دوس على الكرسي الفاضي عشان تحجزه')}</p>
  <p class="vinfo">${vo(van).driver?'السواق: <b>'+esc(vo(van).driver)+'</b>':''}${isDriver ? '' : '<br><button id="editv">تعديل بيانات العربية</button> · <button id="editt">تعديل الرحلة</button>'}</p>
  ${isDriver ? '<p class="info">صلاحيتك: عرض أرقام الركاب وإلغاء الحجز فقط</p>' : '<p class="info"><button style="border:0;background:none;color:var(--danger);text-decoration:underline" id="delv">مسح العربية دي</button></p>'}`;
  $('main').innerHTML = h;
  document.querySelectorAll('.seat').forEach(el => el.onclick = () => tapSeat(+el.dataset.s));
  if (!isDriver) { $('delv').onclick = delVan; $('editv').onclick = () => vanForm(van); $('editt').onclick = () => tripForm(trip); }
  $('bar').hidden = isDriver;
  checkBtn();
  renderSummary();
}
function checkBtn() { $('book').disabled = !(sel.size && $('phone').value.replace(/\D/g,'').length >= 8); }
$('phone').oninput = checkBtn;

function renderSummary() {
  if (isDriver) { $('summary').innerHTML = ''; return; }
  let rows = '';
  Object.keys(vans).forEach(vid => {
    const tobj = trips(vid);
    Object.keys(tobj).forEach(tid => {
      const seats = (dayBookings[vid]||{})[tid] || {};
      Object.keys(seats).sort((a,b)=>a-b).forEach(seat => {
        const bk = seats[seat];
        rows += `<div class="srow"><span>${esc(vo(vid).name)} · ${esc(tobj[tid].label||tobj[tid].time)} · كرسي ${seat}</span><span class="muted">${esc(bk.phone)}${bk.pickup?' · '+esc(bk.pickup):''}</span></div>`;
      });
    });
  });
  $('summary').innerHTML = `<h3>كل حجوزات اليوم (${date})</h3>` + (rows || '<p class="info" style="margin:0">مفيش حجوزات النهارده لسه</p>') + rows;
}

function tapSeat(n) {
  const tk = curBookings()[n];
  if (tk) return askCancel(n, tk);
  if (isDriver) return;
  sel.has(n) ? sel.delete(n) : sel.add(n);
  render();
}

$('book').onclick = async () => {
  const phone = $('phone').value.replace(/\s/g, '');
  const seats = [...sel], failed = [];
  $('book').disabled = true;
  for (const n of seats) {
    try {
      const r = await db.ref(`avail/${date}/${van}/${trip}/${n}`).transaction(cur => cur ? undefined : true);
      if (r.committed) await db.ref(`bookings/${date}/${van}/${trip}/${n}`).set({ phone, at: firebase.database.ServerValue.TIMESTAMP });
      else failed.push(n);
    } catch (e) { failed.push(n); }
  }
  sel.clear(); $('phone').value = '';
  render();
  const ok = seats.filter(n => !failed.includes(n));
  if (failed.length) alert('الكراسي دي اتحجزت قبلك: ' + failed.join('، '));
  if (ok.length) showDone(phone, ok, false);
};

function askCancel(n, tk) {
  const d = $('dlg');
  d.innerHTML = `<div><p>كرسي ${n} محجوز لـ</p><div class="ph">${esc(tk.phone)}</div>${tk.pickup?`<p style="color:var(--mute);font-size:14px;margin-top:-8px">منطقة الركوب: ${esc(tk.pickup)}</p>`:''}
    <div class="row"><button class="btn" id="no">رجوع</button><button class="btn red" id="yes">إلغاء الحجز</button></div></div>`;
  d.hidden = false;
  $('no').onclick = () => d.hidden = true;
  $('yes').onclick = async () => {
    await db.ref(`avail/${date}/${van}/${trip}/${n}`).remove();
    await db.ref(`bookings/${date}/${van}/${trip}/${n}`).remove();
    showCancelled(n, tk);
  };
}

function showCancelled(n, tk) {
  const v = vo(van), tb = trips(van)[trip] || {};
  const msg = `تم إلغاء حجز - ${v.name} - ${tb.label||tb.time} - ${date} - كرسي ${n} - كان لتليفون ${tk.phone}`;
  const d = $('dlg');
  if (isDriver && v.ownerPhone) {
    d.innerHTML = `<div><p>تم إلغاء الحجز</p><p style="color:var(--mute);font-size:14px">لازم تبلّغ صاحب العربية قبل ما تكمل</p>
      <div class="stack"><a class="btn wa" target="_blank" rel="noopener" id="waL" href="${wa(v.ownerPhone, msg)}">إبلاغ صاحب العربية (واتساب)</a>
      <button class="btn" id="dn" disabled style="background:#b8c4c6">تم الإبلاغ</button></div></div>`;
    d.hidden = false;
    $('waL').onclick = () => { $('dn').disabled = false; $('dn').style.background = '#e3e9e7'; };
    $('dn').onclick = () => d.hidden = true;
  } else {
    d.hidden = true;
  }
}

function vanForm(id) {
  const v = id ? vo(id) : {};
  const d = $('dlg');
  d.innerHTML = `<div><p>${id ? 'تعديل العربية' : 'عربية جديدة'}</p>
    <input id="f-name" placeholder="اسم أو رقم العربية" value="${esc(v.name || '')}">
    <input id="f-driver" placeholder="اسم السواق" value="${esc(v.driver || '')}">
    <input id="f-dphone" type="tel" inputmode="tel" placeholder="تليفون السواق (اختياري)" value="${esc(v.driverPhone || '')}">
    <input id="f-ophone" type="tel" inputmode="tel" placeholder="تليفون صاحب العربية (إجباري لتأكيد الحجوزات)" value="${esc(v.ownerPhone || '')}">
    <div class="row" style="margin-top:10px"><button class="btn" id="f-no">رجوع</button><button class="btn" id="f-ok">حفظ</button></div></div>`;
  d.hidden = false;
  $('f-no').onclick = () => d.hidden = true;
  $('f-ok').onclick = async () => {
    const name = $('f-name').value.trim(); if (!name) return;
    const ownerPhone = $('f-ophone').value.trim();
    if (!ownerPhone) { alert('تليفون صاحب العربية إجباري عشان تصله رسائل تأكيد الحجز.'); return; }
    const obj = { name, driver: $('f-driver').value.trim(), driverPhone: $('f-dphone').value.trim(), ownerPhone, trips: v.trips || {} };
    d.hidden = true;
    if (id) await db.ref('vans/' + id).set(obj); else { const r = await db.ref('vans').push(obj); van = r.key; }
  };
}

function tripForm(tid) {
  const tb = tid ? (trips(van)[tid]||{}) : {};
  const d = $('dlg');
  const list = Object.entries(trips(van)).map(([id,tb]) =>
    `<div class="triprow"><b>${esc(tb.label||'')} - ${esc(tb.time||'')}</b><button data-del="${id}">حذف</button></div>`).join('');
  d.innerHTML = `<div><p>${tid?'تعديل الرحلة':'رحلات ' + esc(vo(van).name)}</p>
    ${!tid ? `<div class="triplist">${list || '<p class="info" style="margin:4px 0">مفيش رحلات لسه</p>'}</div>` : ''}
    <input id="tf-label" placeholder="اسم الرحلة (مثال: ذهاب الإسكندرية)" value="${esc(tb.label||'')}">
    <input id="tf-time" placeholder="الميعاد (مثال: 1:00 ظهرًا)" value="${esc(tb.time||'')}">
    <div class="row" style="margin-top:10px"><button class="btn" id="tf-no">${tid?'رجوع':'قفل'}</button><button class="btn" id="tf-ok">${tid?'حفظ':'إضافة رحلة'}</button></div></div>`;
  d.hidden = false;
  d.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    const tid2 = btn.dataset.del;
    if (confirm('تمسح الرحلة دي وكل حجوزاتها؟')) {
      await db.ref(`vans/${van}/trips/${tid2}`).remove();
      db.ref('bookings').once('value', s => s.forEach(day => day.child(van).child(tid2).ref.remove()));
      db.ref('avail').once('value', s => s.forEach(day => day.child(van).child(tid2).ref.remove()));
      if (trip === tid2) trip = null;
      tripForm();
    }
  });
  $('tf-no').onclick = () => d.hidden = true;
  $('tf-ok').onclick = async () => {
    const label = $('tf-label').value.trim(), time = $('tf-time').value.trim();
    if (!label || !time) return;
    if (tid) { await db.ref(`vans/${van}/trips/${tid}`).set({ label, time }); d.hidden = true; }
    else { const r = await db.ref(`vans/${van}/trips`).push({ label, time }); trip = r.key; tripForm(); }
  };
}

function showDone(phone, seats, cancelled) {
  const v = vo(van), tb = trips(van)[trip] || {}, list = seats.sort((a,b)=>a-b).join('، '), w = seats.length > 1 ? 'الكراسي' : 'الكرسي';
  const msg = `حجز جديد - ${v.name} - ${tb.label||''} ${tb.time||''} - ${date} - ${w} ${list} - تليفون الراكب ${phone}`;
  const d = $('dlg');
  if (v.ownerPhone) {
    d.innerHTML = `<div><p>تم الحجز ✅</p><div class="ph">${esc(phone)}</div>
      <p style="color:var(--mute);font-size:14px">لازم تبلّغ صاحب العربية قبل ما تقفل</p>
      <div class="stack"><a class="btn wa" target="_blank" rel="noopener" id="waL" href="${wa(v.ownerPhone, msg)}">إبلاغ صاحب العربية (واتساب)</a>
      <button class="btn" id="dn" disabled style="background:#b8c4c6">تم الإبلاغ</button></div></div>`;
    d.hidden = false;
    $('waL').onclick = () => { $('dn').disabled = false; $('dn').style.background = '#e3e9e7'; };
    $('dn').onclick = () => d.hidden = true;
  } else {
    alert('تم الحجز، بس متسجّلش تليفون صاحب العربية. ضيفه من "تعديل بيانات العربية".');
  }
}

function delVan() {
  if (confirm('تمسح ' + vo(van).name + ' وكل رحلاتها وحجوزاتها؟')) {
    const id = van; van = null; trip = null;
    db.ref('vans/' + id).remove();
    db.ref('bookings').once('value', s => s.forEach(day => day.child(id).ref.remove()));
    db.ref('avail').once('value', s => s.forEach(day => day.child(id).ref.remove()));
  }
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
